<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ccprobe</title>
<link rel="icon" href="/icon.svg">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-run" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></symbol>
  <symbol id="i-think" viewBox="0 0 16 16"><circle cx="3.5" cy="8" r="1.7" fill="currentColor"/><circle cx="8" cy="8" r="1.7" fill="currentColor"/><circle cx="12.5" cy="8" r="1.7" fill="currentColor"/></symbol>
  <symbol id="i-wait" viewBox="0 0 16 16"><path d="M4 2h8M4 14h8M5 2c0 4 6 4 6 6s-6 2-6 6M11 2c0 4-6 4-6 6s6 2 6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-park" viewBox="0 0 16 16"><rect x="4" y="3" width="2.8" height="10" rx="1" fill="currentColor"/><rect x="9.2" y="3" width="2.8" height="10" rx="1" fill="currentColor"/></symbol>
  <symbol id="i-ask" viewBox="0 0 16 16"><path d="M5.5 5.8a2.6 2.6 0 1 1 3.6 2.4c-.7.3-1.1.8-1.1 1.6v.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="13" r="1.1" fill="currentColor"/></symbol>
  <symbol id="i-done" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-stuck" viewBox="0 0 16 16"><path d="M8 2.5v7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="8" cy="13" r="1.3" fill="currentColor"/></symbol>
  <symbol id="i-dead" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-lock" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="currentColor"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-unlock" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="currentColor"/><path d="M5.5 7V5a2.5 2.5 0 0 1 4.9-.6" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-gear" viewBox="0 0 16 16"><path d="M8 5.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6zM6.8 1h2.4l.4 1.9 1.3.6 1.7-1 1.7 1.7-1 1.7.6 1.3 1.9.4v2.4l-1.9.4-.6 1.3 1 1.7-1.7 1.7-1.7-1-1.3.6-.4 1.9H6.8l-.4-1.9-1.3-.6-1.7 1-1.7-1.7 1-1.7-.6-1.3L.2 9.2V6.8l1.9-.4.6-1.3-1-1.7 1.7-1.7 1.7 1 1.3-.6z" fill="currentColor" fill-rule="evenodd"/></symbol>
  <symbol id="i-bell" viewBox="0 0 16 16"><path d="M8 1.8a4.2 4.2 0 0 0-4.2 4.2v3L2.3 11.6h11.4L12.2 9V6A4.2 4.2 0 0 0 8 1.8zM6.3 13a1.8 1.8 0 0 0 3.4 0z" fill="currentColor"/></symbol>
  <symbol id="i-cup" viewBox="0 0 16 16"><path d="M2.5 5.5h9v4.5a3.5 3.5 0 0 1-3.5 3.5h-2A3.5 3.5 0 0 1 2.5 10zM11.5 6.5h1.2a1.8 1.8 0 0 1 0 3.6h-1.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 1.5v2M8 1.5v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
  <symbol id="i-lead" viewBox="-16 -16 32 32"><g stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M0-12V12M-12 0H12M-8.5-8.5l17 17M8.5-8.5l-17 17"/></g></symbol>
  <symbol id="i-queue" viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-fit" viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
</svg>

<header class="top">
  <div class="brand"><svg class="logo" viewBox="-10 -10 20 20"><polygon points="0,-9 7.8,-4.5 7.8,4.5 0,9 -7.8,4.5 -7.8,-4.5"/><circle r="2.4"/></svg>ccprobe</div>
  <div class="conn" id="conn" data-state="connecting"><span class="dot"></span><span id="connText">Connecting…</span></div>
  <div class="chips" id="chips"></div>
  <button class="iconbtn" id="alertBtn" aria-label="Alerts"><svg><use href="#i-bell"/></svg><span class="count" id="alertCount" hidden></span></button>
  <button class="iconbtn" id="gearBtn" aria-label="Settings" aria-expanded="false"><svg><use href="#i-gear"/></svg></button>
  <div class="popover" id="settings" hidden>
    <div class="pop-h">Settings</div>
    <div class="set"><span>Theme</span><div class="seg" data-set="theme"><button data-v="system">System</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div></div>
    <div class="set"><span>Motion</span><div class="seg" data-set="motion"><button data-v="full">Full</button><button data-v="reduced">Reduced</button><button data-v="off">Off</button></div></div>
    <div class="set"><span>Timeline</span><div class="seg" data-set="span"><button data-v="900">15m</button><button data-v="2700">45m</button><button data-v="7200">2h</button><button data-v="21600">6h</button></div></div>
    <label class="chk"><input type="checkbox" data-set="showFinished"> Show finished agents</label>
    <label class="chk"><input type="checkbox" data-set="compact"> Compact nodes</label>
    <label class="chk"><input type="checkbox" data-set="notify"> Desktop notifications <small>(red alerts, needs you)</small></label>
    <div class="pop-sep"></div>
    <button class="linkbtn" id="resetBtn">Reset layout &amp; dismissed alerts</button>
    <div class="pop-foot" id="popFoot"></div>
  </div>
</header>

<main class="layout">
  <aside class="rail" id="rail" aria-label="Sessions"></aside>
  <section class="stage" id="stage">
    <svg id="graph" role="img" aria-label="Agents of the selected session">
      <defs>
        <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
      </defs>
      <g id="vp"><g id="gEdges"></g><g id="gNodes"></g><g id="gTethers"></g><g id="gCards"></g><g id="gPulse"></g></g>
    </svg>
    <div class="ticker" id="ticker" hidden></div>
    <button class="fitbtn" id="fitBtn" hidden><svg><use href="#i-fit"/></svg>Fit</button>
    <div class="empty" id="empty"><div class="skel"></div><div id="emptyText">Connecting to the ccprobe server…</div></div>
    <details class="legend" id="legend">
      <summary>Legend</summary>
      <div><i class="lg lg-task"></i>task in flight</div>
      <div><i class="lg lg-msg"></i>messages (hot when recent)</div>
      <div><i class="lg lg-spawn"></i>spawned by</div>
      <div><i class="lg lg-lock"></i>holds the window</div>
      <div><i class="lg lg-pulse"></i>message in transit</div>
    </details>
  </section>
  <aside class="side">
    <nav class="tabs" role="tablist">
      <button data-tab="agent" role="tab">Agent</button>
      <button data-tab="wts" role="tab">WTS</button>
      <button data-tab="alerts" role="tab">Alerts<span class="tcount" id="tabCount" hidden></span></button>
    </nav>
    <div id="panel" class="panel"></div>
  </aside>
</main>

<footer class="timeline">
  <div class="tlhead"><span id="tlTitle">Timeline</span><span class="seg small" data-set="span"><button data-v="900">15m</button><button data-v="2700">45m</button><button data-v="7200">2h</button><button data-v="21600">6h</button></span></div>
  <svg id="tl"></svg>
</footer>
<div class="tip" id="tip" hidden></div>
<script src="/app.js"></script>
</body>
</html>
